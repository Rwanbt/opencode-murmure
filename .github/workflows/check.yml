name: Plugin checks
on:
  pull_request:
  push:
    branches:
      - feat/v2-session-binding-core
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned dependencies
        run: npm install --ignore-scripts --no-audit
      - name: Unit tests and V2 typecheck
        run: npm run check
